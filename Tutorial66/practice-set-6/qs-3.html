    <script>
      function ageChecker() {
        age = prompt("Enter your age below :");

          alert("You age not possible");

          alert("You can't drive");
        } else {
          alert("You can drive");
        }

        again = confirm("Do u want to see the prompt again?");

        if (again == true) {
          ageChecker();
        } else {
          console.log("Done");
        }
      }
      ageChecker();
    </script>
